<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Errore di caricamento</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fa;
      color: #202b3c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 40px;
      border: 1px solid #e2e7ee;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 32px rgb(32 43 60 / 5%);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
      border-radius: 12px;
      color: #526176;
      background: #edf1f6;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 1.75rem); line-height: 1.25; letter-spacing: -.025em; }
    p { margin: 0; color: #566276; }
    button {
      margin-top: 28px;
      min-height: 46px;
      padding: 11px 24px;
      border: 1px solid #263e63;
      border-radius: 8px;
      background: #263e63;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1b2e4c; }
    button:active { background: #14243c; }
    button:focus-visible { outline: 3px solid #719bdb; outline-offset: 4px; }
    .details { margin-top: 28px; padding-top: 20px; border-top: 1px solid #e9edf2; font-size: .8125rem; color: #657186; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .8125rem; }
    noscript p { margin-top: 16px; font-size: .875rem; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      main { padding: 28px 24px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="error-title">
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7.5v5"/>
        <path d="M12 16h.01"/>
      </svg>
    </div>
    <h1 id="error-title">Errore di caricamento</h1>
    <p>La pagina non è stata caricata correttamente. Riprova tra qualche istante.</p>
    <button type="button" onclick="window.location.reload()">Riprova</button>
    <noscript><p>Per riprovare, ricarica la pagina usando il comando del browser.</p></noscript>
    <p class="details">Codice errore: <code>LOAD_ERROR</code></p>
  </main>
</body>
</html>
